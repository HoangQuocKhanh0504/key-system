<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KHANHPC • ULTIMATE KEY SYSTEM</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts: Orbitron + Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0A0A0F;
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background Grid */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 70, 70, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 70, 70, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Glow Orbs */
        .glow-orb-1 {
            position: fixed;
            top: -30%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(255, 60, 60, 0.25), transparent 70%);
            filter: blur(80px);
            z-index: 0;
            animation: floatOrb 12s ease-in-out infinite;
        }

        .glow-orb-2 {
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(255, 80, 200, 0.2), transparent 70%);
            filter: blur(90px);
            z-index: 0;
            animation: floatOrb 15s ease-in-out infinite reverse;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
            50% { transform: translate(30px, -30px) scale(1.1); opacity: 0.9; }
        }

        /* Scanline Effect */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 2px,
                transparent 2px,
                transparent 8px
            );
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 620px;
        }

        /* Main Card - Neo-Brutalist + Glassmorphism */
        .cyber-card {
            background: rgba(8, 8, 14, 0.65);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            border: 1px solid rgba(255, 70, 70, 0.4);
            padding: 2.5rem 2rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 70, 70, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .cyber-card:hover {
            border-color: #FF3A3A;
            box-shadow: 0 35px 55px rgba(0, 0, 0, 0.7), 0 0 45px rgba(255, 70, 70, 0.35);
            transform: translateY(-5px);
        }

        /* Premium Header */
        .premium-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .hologram-avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #FF2E2E, #8B0000);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 50, 50, 0.6), 0 0 0 4px rgba(255, 255, 255, 0.1), inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .hologram-avatar::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: linear-gradient(45deg, #FF4444, #FFAAAA, #FF4444);
            opacity: 0;
            transition: opacity 0.5s;
        }

        .hologram-avatar:hover::before {
            opacity: 0.6;
            filter: blur(4px);
        }

        .hologram-avatar i {
            font-size: 58px;
            color: white;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
            z-index: 2;
        }

        .glitch-text {
            font-family: 'Orbitron', monospace;
            font-size: 3.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFFFFF, #FF9090, #FF3A3A);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 4px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FFFFFF, #FF9090);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .glitch-text::before {
            animation: glitch 0.3s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            transform: translate(-2px, -1px);
            opacity: 0.6;
        }

        .glitch-text::after {
            animation: glitch 0.3s infinite reverse;
            clip-path: polygon(0 80%, 100% 20%, 100% 100%, 0 100%);
            transform: translate(2px, 1px);
            opacity: 0.6;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 1px); }
            40% { transform: translate(2px, -1px); }
            60% { transform: translate(-1px, 2px); }
            80% { transform: translate(1px, -2px); }
            100% { transform: translate(0); }
        }

        .badge-ultimate {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 50, 50, 0.2);
            border: 1px solid rgba(255, 70, 70, 0.6);
            border-radius: 60px;
            padding: 6px 18px;
            margin-top: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #FFAAAA;
            backdrop-filter: blur(5px);
        }

        /* Key Container - Neo */
        .vault-section {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 36px;
            padding: 1.8rem;
            margin: 28px 0;
            border: 1px solid rgba(255, 75, 75, 0.3);
            position: relative;
            overflow: hidden;
        }

        .vault-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 70, 70, 0.1), transparent);
            animation: shimmer 8s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .key-locker {
            background: #020208;
            border-radius: 28px;
            padding: 1.8rem 1.2rem;
            border: 1px solid #2A2A35;
            transition: all 0.3s;
        }

        .key-label-modern {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px dashed rgba(255, 70, 70, 0.5);
        }

        .key-label-modern span {
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: #FF6B6B;
        }

        .key-value {
            font-family: 'Courier New', 'Fira Code', monospace;
            font-size: 1.9rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #C0FFD0, #7BED9F);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(123, 237, 159, 0.3);
            word-break: break-all;
            cursor: pointer;
            padding: 15px;
            border-radius: 20px;
            transition: all 0.2s;
            background-color: #0B0B10;
            border: 1px solid #2CAA5E;
        }

        .key-value:hover {
            background: #11121A;
            transform: scale(1.01);
            border-color: #FF5E5E;
            letter-spacing: 6px;
        }

        .copy-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            font-size: 0.7rem;
            color: #6B6B8A;
            font-weight: 500;
        }

        /* ULTRA BUTTON */
        .btn-ultimate {
            width: 100%;
            background: linear-gradient(95deg, #E63E3E, #B81A1A);
            border: none;
            padding: 1.3rem;
            border-radius: 60px;
            font-family: 'Orbitron', monospace;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 3px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            cursor: pointer;
            transition: all 0.15s linear;
            box-shadow: 0 10px 0 0 #6E0E0E;
            margin: 20px 0 20px;
            position: relative;
            overflow: hidden;
        }

        .btn-ultimate::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn-ultimate:hover::before {
            left: 100%;
        }

        .btn-ultimate:active {
            transform: translateY(4px);
            box-shadow: 0 6px 0 0 #6E0E0E;
        }

        .btn-ultimate:disabled {
            opacity: 0.65;
            transform: translateY(0);
            filter: grayscale(0.2);
            cursor: not-allowed;
        }

        /* Loading Module */
        .loading-hud {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50px;
            padding: 12px 20px;
            margin: 15px 0;
            border: 1px solid #FF4545;
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background: #FF3A3A;
            border-radius: 50%;
            animation: pulseRed 1.2s infinite;
        }

        @keyframes pulseRed {
            0%, 100% { opacity: 0.4; transform: scale(0.8); box-shadow: 0 0 0 0 rgba(255, 70, 70, 0.7);}
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 0 8px rgba(255, 70, 70, 0);}
        }

        /* Status Terminal */
        .status-terminal {
            background: rgba(0, 0, 0, 0.55);
            border-radius: 30px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 0.8rem;
            font-weight: 500;
            font-family: 'Space Grotesk', monospace;
            border-left: 3px solid #FF3A3A;
            color: #AFAFCF;
        }

        .footer-cyber {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 28px;
            font-size: 0.65rem;
            color: #4A4A62;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .error-card {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 50, 50, 0.15);
            border-radius: 30px;
            padding: 12px;
            margin: 12px 0 0;
            font-size: 0.75rem;
            color: #FFA0A0;
            border: 1px solid #FF5555;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>
    <div class="scanline"></div>

    <div class="container">
        <div class="cyber-card">
            <div class="premium-header">
                <div class="hologram-avatar">
                    <i class="fas fa-dragon"></i>
                </div>
                <h1 class="glitch-text" data-text="KHANHPC">KHANHPC</h1>
                <div class="badge-ultimate">
                    <i class="fas fa-skull"></i> ELITE ACCESS <i class="fas fa-bolt"></i>
                </div>
            </div>

            <!-- Vault Key -->
            <div class="vault-section">
                <div class="key-locker">
                    <div class="key-label-modern">
                        <span><i class="fas fa-fingerprint"></i> DECRYPTION TOKEN</span>
                        <span>✦ LIFETIME ✦</span>
                    </div>
                    <div class="key-value" id="secretKeyDisplay">
                        ██████████
                    </div>
                    <div class="copy-indicator" id="copyNotif">
                        <i class="fa-regular fa-clipboard"></i> click vào key để sao chép mã
                    </div>
                </div>
                <div class="error-card" id="errorAlert">
                    <i class="fas fa-skull-crossbones"></i> keys.json không tồn tại hoặc lỗi cấu trúc
                </div>
            </div>

            <!-- Loading state -->
            <div id="loadingOverlay" style="display: none;">
                <div class="loading-hud">
                    <div class="pulse-dot"></div>
                    <span style="color:#FFAFAF; font-weight: 600;"><i class="fas fa-sync-alt fa-spin"></i> GENERATING SECURE TOKEN ...</span>
                    <span style="color:#FF6B6B; font-size:12px;">10s</span>
                </div>
            </div>

            <!-- Action Button -->
            <button class="btn-ultimate" id="unlockBtn">
                <i class="fab fa-youtube"></i> UNLOCK KEY
                <i class="fas fa-caret-right"></i>
            </button>

            <!-- Status Area -->
            <div class="status-terminal" id="globalStatus">
                <i class="fas fa-shield-haltered"></i> 
                <span>STANDBY // Nhấn UNLOCK để nhận key premium</span>
            </div>

            <div class="footer-cyber">
                <i class="fas fa-microchip"></i> ENCRYPTED BY KHANHPC 
                <i class="fas fa-key"></i> 1 KEY / VĨNH VIỄN
            </div>
        </div>
    </div>

    <script>
        (function() {
            // --------------------------------------------------------------
            // HIGH-TECH KEY GENERATOR SYSTEM
            let keyRepository = [];     // Lưu keys từ keys.json
            let actionTimeout = null;
            let isBusy = false;

            // DOM Elements
            const keyDisplayEl = document.getElementById('secretKeyDisplay');
            const copyHintEl = document.getElementById('copyNotif');
            const unlockButton = document.getElementById('unlockBtn');
            const loadingDiv = document.getElementById('loadingOverlay');
            const statusDiv = document.getElementById('globalStatus');
            const errorAlertDiv = document.getElementById('errorAlert');

            // Helper: cập nhật status
            function updateStatus(msg, isError = false, icon = "fa-circle-info") {
                statusDiv.innerHTML = `<i class="fas ${icon}"></i> <span>${msg}</span>`;
                if (isError) {
                    statusDiv.style.borderLeftColor = "#FF6B6B";
                    statusDiv.style.color = "#FFB0B0";
                } else {
                    statusDiv.style.borderLeftColor = "#FF3A3A";
                    statusDiv.style.color = "#AFAFCF";
                }
            }

            // Hiển thị lỗi keys.json
            function handleFileError(show) {
                if (show) {
                    errorAlertDiv.style.display = "flex";
                    unlockButton.disabled = true;
                    keyDisplayEl.textContent = "⚠️ ERROR ⚠️";
                    keyDisplayEl.style.background = "#1A0A0A";
                    keyDisplayEl.style.borderColor = "#FF4444";
                    updateStatus("CRITICAL: Không thể tải keys.json, kiểm tra file!", true, "fa-exclamation-triangle");
                } else {
                    errorAlertDiv.style.display = "none";
                    if (keyRepository.length > 0) unlockButton.disabled = false;
                }
            }

            // Load keys from keys.json
            async function fetchKeysFromServer() {
                try {
                    const response = await fetch(`keys.json?nocache=${Date.now()}`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const jsonData = await response.json();
                    if (jsonData && Array.isArray(jsonData.keys) && jsonData.keys.length > 0) {
                        keyRepository = jsonData.keys;
                        console.log(`[KHANHPC] ✅ Loaded ${keyRepository.length} premium keys`);
                        handleFileError(false);
                        updateStatus(`✔ SYSTEM READY // ${keyRepository.length} keys available`, false, "fa-check-circle");
                        unlockButton.disabled = false;
                        return true;
                    } else {
                        throw new Error("Invalid keys structure");
                    }
                } catch (err) {
                    console.error("[KHANHPC] Lỗi keys.json:", err);
                    keyRepository = [];
                    handleFileError(true);
                    updateStatus("FATAL: keys.json missing or malformed", true, "fa-database");
                    return false;
                }
            }

            // Random key từ repository
            function getRandomSecretKey() {
                if (!keyRepository.length) return null;
                const randomIdx = Math.floor(Math.random() * keyRepository.length);
                return keyRepository[randomIdx];
            }

            // Copy key sang clipboard + hiệu ứng đẹp
            async function copyKeyToClipboard() {
                const currentKeyRaw = keyDisplayEl.textContent;
                if (!currentKeyRaw || currentKeyRaw.includes("█") || currentKeyRaw.includes("⚠️") || currentKeyRaw === "⏳ LOADING..." || currentKeyRaw.includes("ERROR")) {
                    copyHintEl.innerHTML = `<i class="fas fa-ban"></i> Chưa có key hợp lệ!`;
                    copyHintEl.style.color = "#FF8888";
                    setTimeout(() => {
                        copyHintEl.innerHTML = `<i class="fa-regular fa-clipboard"></i> click vào key để sao chép mã`;
                        copyHintEl.style.color = "#6B6B8A";
                    }, 1500);
                    return;
                }
                try {
                    await navigator.clipboard.writeText(currentKeyRaw);
                    copyHintEl.innerHTML = `<i class="fas fa-check-circle"></i> ĐÃ COPY: ${currentKeyRaw.substring(0, 12)}...`;
                    copyHintEl.style.color = "#A5FFD6";
                    setTimeout(() => {
                        copyHintEl.innerHTML = `<i class="fa-regular fa-clipboard"></i> click vào key để sao chép mã`;
                        copyHintEl.style.color = "#6B6B8A";
                    }, 2800);
                } catch (err) {
                    copyHintEl.innerHTML = `<i class="fas fa-times"></i> Lỗi copy thủ công`;
                }
            }

            // Hàm xử lý chính lấy key - siêu đẹp mắt + YouTube redirect & delay 10s
            async function initiateUltimateKeyFetch() {
                if (isBusy) {
                    updateStatus("Hệ thống đang xử lý, chờ 10s...", false, "fa-hourglass-half");
                    return;
                }

                // Kiểm tra nếu chưa có key thì thử reload keys.json
                if (keyRepository.length === 0) {
                    updateStatus("Đang tải lại kho key...", false, "fa-spinner fa-pulse");
                    const loaded = await fetchKeysFromServer();
                    if (!loaded || keyRepository.length === 0) {
                        updateStatus("Không thể tải key, liên hệ support", true, "fa-skull");
                        return;
                    }
                }

                if (actionTimeout) clearTimeout(actionTimeout);
                isBusy = true;
                unlockButton.disabled = true;
                loadingDiv.style.display = "block";
                
                // Hiệu ứng thông báo & mở YouTube subscribe
                updateStatus("🔗 Mở YouTube & xác thực người dùng...", false, "fa-brands fa-youtube");
                const youtubeSubUrl = "https://www.youtube.com/channel/UCEShobjY7yHzJ3Wardfdd4A?sub_confirmation=1";
                window.open(youtubeSubUrl, "_blank");
                
                // Thay đổi key display tạm thời
                keyDisplayEl.textContent = "⏳ LOADING...";
                keyDisplayEl.style.letterSpacing = "2px";
                keyDisplayEl.style.background = "#15151F";
                
                let countdown = 10;
                const intervalTimer = setInterval(() => {
                    if (countdown > 0 && isBusy) {
                        updateStatus(`🎬 Xác minh thành công • Tạo key sau ${countdown}s`, false, "fa-clock");
                        countdown--;
                    } else {
                        clearInterval(intervalTimer);
                    }
                }, 1000);
                
                // Timeout 10 giây -> tạo key real
                actionTimeout = setTimeout(() => {
                    clearInterval(intervalTimer);
                    const generatedKey = getRandomSecretKey();
                    
                    if (generatedKey) {
                        keyDisplayEl.textContent = generatedKey;
                        keyDisplayEl.style.letterSpacing = "4px";
                        keyDisplayEl.style.background = "#0A0E12";
                        keyDisplayEl.style.borderColor = "#7BED9F";
                        keyDisplayEl.style.color = "#C3FFDA";
                        updateStatus("✔ KEY GENERATED! Click vào key để copy & kích hoạt ngay", false, "fa-gem");
                        // auto copy ngay lập tức
                        navigator.clipboard.writeText(generatedKey).catch(()=>{});
                        copyHintEl.innerHTML = `<i class="fas fa-crown"></i> Đã tự động copy vào bộ nhớ!`;
                        copyHintEl.style.color = "#D4FFB0";
                        setTimeout(() => {
                            copyHintEl.innerHTML = `<i class="fa-regular fa-clipboard"></i> click vào key để sao chép mã`;
                            copyHintEl.style.color = "#6B6B8A";
                        }, 3500);
                    } else {
                        keyDisplayEl.textContent = "❌ NULL KEY";
                        keyDisplayEl.style.color = "#FF7A7A";
                        updateStatus("LỖI: Không tìm thấy key trong repository", true, "fa-exclamation");
                    }
                    
                    loadingDiv.style.display = "none";
                    unlockButton.disabled = false;
                    isBusy = false;
                    actionTimeout = null;
                }, 10000);
            }
            
            // Event listeners
            unlockButton.addEventListener('click', () => {
                if (unlockButton.disabled && !isBusy && keyRepository.length === 0) {
                    fetchKeysFromServer().then(success => {
                        if (success) initiateUltimateKeyFetch();
                    });
                    return;
                }
                initiateUltimateKeyFetch();
            });
            
            keyDisplayEl.addEventListener('click', copyKeyToClipboard);
            
            // Khởi tạo ngay khi load trang
            async function bootstrap() {
                unlockButton.disabled = true;
                updateStatus("Đang tải cơ sở dữ liệu mã nguồn...", false, "fa-spinner fa-pulse");
                await fetchKeysFromServer();
                if (keyRepository.length === 0) {
                    keyDisplayEl.textContent = "⚠️ NO KEYS";
                } else {
                    keyDisplayEl.textContent = "█✧█✧█✧█✧█";
                    keyDisplayEl.style.letterSpacing = "3px";
                }
            }
            bootstrap();
        })();
    </script>
</body>
</html>
